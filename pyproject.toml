[project]
name = "stalker-ai-quest-generator"
version = "1.0.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "comfykit>=0.1.12",
    "jinja2>=3.1.6",
    "loguru>=0.7.3",
    "openai>=2.14.0",
    "pillow>=12.1.0",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.12.0",
    "pyside6>=6.10.1",
    "requests>=2.34.2",
]

[dependency-groups]
dev = [
    "commitizen>=4.16.3",
    "prek>=0.5.9",
    "pyproject-fmt>=2.30.3",
    "ruff>=0.15.17",
    "rumdl>=0.3.2",
    "ty>=0.0.93",
]
build = [
    "pyinstaller>=6.22.3",
]

[tool.uv]
default-groups = [ "dev", "build" ]

[tool.ruff]
exclude = [
    "app/resources/rc_main.py",
]

[tool.ruff.lint.per-file-ignores]
"app/main.py" = [ "INP001" ]
"scripts/**" = [ "INP001", "T201" ]

[tool.ruff.lint]
select = [ "ALL" ]
ignore = [
    "ANN401",
    "BLE001",
    "COM812",
    "D1",
    "D200",
    "D202",
    "D203",
    "D212",
    "N802",
    "N803",
    "N815",
    "PLR0913",
    "RET504",
    "RUF001",
    "RUF002",
    "RUF003",
    "S603",
]

[tool.pyproject-fmt]
indent = 4
keep_full_version = true
generate_python_version_classifiers = false
table_format = "long"
sub_table_spacing = "\n"

[tool.typos.default.extend-words]
datas = "datas"

[tool.ty.src]
include = [ "app" ]
exclude = [ "app/resources/rc_main.py" ]

[tool.ty.environment]
extra-paths = [ "app" ]

[tool.commitizen]
name = "cz_conventional_commits"
version_scheme = "semver2"
version_provider = "scm"
tag_format = "$version"
changelog_incremental = true
update_changelog_on_bump = true
breaking_change_exclamation_in_title = true

[tool.pyside6-project]
files = [
    "app/main.py",
    "app/resources/main.qrc",
]
