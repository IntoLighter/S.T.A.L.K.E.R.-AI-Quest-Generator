exclude = '^app/resources/rc_main\.py$'
default_install_hook_types = ["pre-commit", "commit-msg", "pre-push"]

[[repos]]
repo = "builtin"
hooks = [
  # Fixers
  { id = "trailing-whitespace" },
  { id = "end-of-file-fixer" },
  { id = "mixed-line-ending" },
  { id = "fix-byte-order-marker" },
  { id = "pretty-format-json", args = ["--no-sort-keys", "--autofix"] },

  # Syntax
  { id = "check-json" },
  { id = "check-json5" },
  { id = "check-toml" },
  { id = "check-yaml" },
  { id = "check-xml" },

  # Repository
  { id = "check-added-large-files" },
  { id = "check-case-conflict" },
  { id = "check-merge-conflict" },
  { id = "check-symlinks" },
  { id = "destroyed-symlinks" },
  { id = "check-vcs-permalinks" },
  { id = "check-executables-have-shebangs" },
  { id = "check-shebang-scripts-are-executable" },
  { id = "detect-private-key" },
  { id = "no-commit-to-branch" },
]

[[repos]]
repo = "https://github.com/crate-ci/typos"
rev = "v1.47.2"
hooks = [{ id = "typos" }]

# Tools from the project environment, versions are pinned in uv.lock
[[repos]]
repo = "local"

[[repos.hooks]]
id = "ruff-check"
name = "ruff check"
entry = "uv run ruff check --force-exclude --fix"
language = "system"
types_or = ["python", "pyi"]
require_serial = true

[[repos.hooks]]
id = "ruff-format"
name = "ruff format"
entry = "uv run ruff format --force-exclude"
language = "system"
types_or = ["python", "pyi"]
require_serial = true

[[repos.hooks]]
id = "ty"
name = "ty check"
entry = "uv run ty check"
language = "system"
types_or = ["python", "pyi"]
pass_filenames = false

[[repos.hooks]]
id = "commitizen"
name = "commitizen check"
entry = "uv run cz check"
args = ["--allow-abort", "--commit-msg-file"]
language = "system"
stages = ["commit-msg"]

[[repos.hooks]]
id = "commitizen-branch"
name = "commitizen check branch"
entry = "uv run cz check"
args = ["--rev-range", "$PRE_COMMIT_FROM_REF..$PRE_COMMIT_TO_REF"]
language = "system"
stages = ["pre-push"]
always_run = true
pass_filenames = false
