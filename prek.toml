exclude = '^app/resources/rc_main\.py$'
default_stages = ["pre-commit"]
default_install_hook_types = ["pre-commit", "commit-msg", "pre-push"]

[[repos]]
repo = "builtin"
hooks = [
  # Fixers
  { id = "trailing-whitespace", args = ["--markdown-linebreak-ext=md"] },
  { id = "end-of-file-fixer" },
  { id = "mixed-line-ending" },
  { id = "fix-byte-order-marker" },
  { id = "pretty-format-json", args = ["--no-sort-keys", "--autofix"], exclude = '^\.vscode/' },

  # Syntax
  { id = "check-json", exclude = '^\.vscode/' },
  { id = "check-jsonc", files = '^\.vscode/.*\.json$', types = ["json"] },
  { id = "check-json5" },
  { id = "check-toml" },
  { id = "check-yaml" },
  { id = "check-xml" },

  # Repository
  { id = "check-added-large-files" },
  { id = "check-case-conflict" },
  { id = "check-illegal-windows-names" },
  { id = "check-merge-conflict" },
  { id = "check-symlinks" },
  { id = "destroyed-symlinks" },
  { id = "check-vcs-permalinks" },
  { id = "check-executables-have-shebangs" },
  { id = "check-shebang-scripts-are-executable" },
  { id = "detect-private-key" },
]

[[repos]]
repo = "https://github.com/crate-ci/typos"
rev = "v1.47.2"
hooks = [{ id = "typos" }]

# Tools from the project environment, versions are pinned in uv.lock
[[repos]]
repo = "local"

[[repos.hooks]]
id = "uv-lock"
name = "uv lock check"
entry = "uv lock --check"
language = "system"
files = '^(pyproject\.toml|uv\.lock)$'
pass_filenames = false

[[repos.hooks]]
id = "pyproject-fmt"
name = "pyproject-fmt"
entry = "uv run pyproject-fmt"
language = "system"
files = '^pyproject\.toml$'

[[repos.hooks]]
id = "rumdl"
name = "rumdl check"
entry = "uv run rumdl check --fix"
language = "system"
types = ["markdown"]
exclude = '^CHANGELOG\.md$'

[[repos.hooks]]
id = "ruff-check"
name = "ruff check"
entry = "uv run ruff check --force-exclude --fix"
language = "system"
types_or = ["python", "pyi"]
require_serial = true

[[repos.hooks]]
id = "ruff-format"
name = "ruff format"
entry = "uv run ruff format --force-exclude"
language = "system"
types_or = ["python", "pyi"]
require_serial = true

[[repos.hooks]]
id = "ty"
name = "ty check"
entry = "uv run ty check"
language = "system"
types_or = ["python", "pyi"]
pass_filenames = false

[[repos.hooks]]
id = "commitizen"
name = "commitizen check"
entry = "uv run cz check"
args = ["--allow-abort", "--commit-msg-file"]
language = "system"
stages = ["commit-msg"]

[[repos.hooks]]
id = "commitizen-branch"
name = "commitizen check branch"
entry = "uv run cz check"
args = ["--rev-range", "origin/HEAD..HEAD"]
language = "system"
stages = ["pre-push"]
always_run = true
pass_filenames = false
